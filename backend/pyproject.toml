[project]
name = "music-catalog-backend"
version = "0.1.0"
description = "Backend for the music album catalog test assignment"
requires-python = ">=3.12,<3.14"
dependencies = [
    "django>=5.2,<6.2",
    "djangorestframework>=3.16,<3.19",
    "django-filter>=25.1",
    "django-cors-headers>=4.6",
    "django-environ>=0.12",
    "drf-spectacular>=0.28",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
testpaths = ["catalog"]
